<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Particle Fusion V5 - Limitless & Benchmark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #050914; overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; touch-action: none; color: white;
        }
        
        #particle-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        #bg-glow {
            position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(5,9,20,0) 60%);
            z-index: 0; transition: background 1s ease; pointer-events: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Menu 3 gạch */
        #menu-btn {
            position: absolute; top: 20px; left: 20px; z-index: 40; width: 50px; height: 50px; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
            cursor: pointer; transition: 0.3s;
        }
        #menu-btn:hover { background: rgba(255, 255, 255, 0.15); }
        #menu-btn span { width: 26px; height: 3px; background: white; border-radius: 3px; transition: 0.3s ease; }

        /* Sidebar Cài đặt */
        #sidebar {
            position: absolute; top: 0; left: -320px; width: 320px; height: 100vh;
            z-index: 30; background: rgba(5, 9, 20, 0.9); padding: 80px 20px 20px 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #sidebar.open { left: 0; }
        
        .sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 25px; color: #4ade80; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .control-group { margin-bottom: 20px; }
        .control-group label { font-size: 13px; color: #ccc; margin-bottom: 8px; display: flex; justify-content: space-between;}
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4ade80; }
        select {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #555; 
            color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 14px;
        }

        /* Benchmark UI */
        #btn-benchmark {
            width: 100%; background: linear-gradient(45deg, #f43f5e, #fb923c);
            border: none; color: white; padding: 12px; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        #btn-benchmark:hover { opacity: 0.8; transform: scale(1.02); }
        #btn-benchmark:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #benchmark-status {
            font-size: 13px; font-weight: bold; color: #fbbf24; margin-top: 10px;
            text-align: center; display: none; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;
        }

        /* UI Main Bottom */
        #ui-container {
            position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 10; padding: 12px; border-radius: 30px;
            flex-wrap: wrap; justify-content: center; width: max-content; max-width: 95vw; align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .btn-emoji { font-size: 20px; width: 45px; height: 45px; border-radius: 50%; }
        .btn-action { font-size: 14px; padding: 0 15px; height: 45px; border-radius: 22.5px; font-weight: bold; }
        .btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-3px); }

        #text-input {
            height: 45px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 0 15px; border-radius: 22.5px; outline: none; font-size: 14px;
            min-width: 140px; transition: 0.3s;
        }
        #text-input:focus { border-color: #4ade80; width: 180px; }

        #image-upload { display: none; }
        #instruction { position: absolute; top: 35px; left: 80px; z-index: 10; pointer-events: none; opacity: 0.5; font-size: 14px; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 25; display: none; opacity: 0; transition: 0.3s;
        }

        @media (max-width: 600px) {
            #instruction { display: none; }
            #ui-container { bottom: 2vh; gap: 8px; padding: 10px; border-radius: 20px; }
            .btn-emoji { width: 40px; height: 40px; font-size: 18px; }
            #text-input { width: 120px; height: 40px; }
            .btn-action { height: 40px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="bg-glow"></div>
    <canvas id="particle-canvas"></canvas>
    <div id="overlay"></div>
    
    <div id="instruction">← Menu: Tăng độ nét (Tối đa 100.000 hạt) & Test hiệu năng máy</div>

    <div id="menu-btn" class="glass"><span></span><span></span><span></span></div>

    <div id="sidebar" class="glass">
        <div class="sidebar-title">⚙️ Cài đặt & Hiệu năng</div>
        
        <div class="control-group">
            <label>
                <span>Độ nét (Số hạt max):</span>
                <span id="particle-count-display">8500</span>
            </label>
            <!-- Giới hạn max đã được tăng lên 100,000 -->
            <input type="range" id="particle-slider" min="2000" max="100000" step="1000" value="8500">
            <small style="font-size: 11px; color: #888; display: block; margin-top: 5px;">*Kéo cao giúp nét căng nhưng có thể gây giật lag trên máy yếu.</small>
        </div>

        <div class="control-group">
            <label>Tương tác chuột:</label>
            <select id="mouse-mode">
                <option value="repulse">💥 Đẩy (Repulse)</option>
                <option value="attract">🧲 Hút (Attract)</option>
                <option value="blackhole">🌌 Lỗ đen (Nhấn giữ xoáy)</option>
                <option value="orbit" selected>🪐 Quỹ đạo (Orbit)</option>
                <option value="vortex">🌪️ Lốc xoáy (Vortex)</option>
            </select>
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
        
        <div class="control-group">
            <label style="color:#f43f5e">🔥 Công cụ nâng cao:</label>
            <button id="btn-benchmark">🧪 Đo giới hạn thiết bị (Stress Test)</button>
            <div id="benchmark-status"></div>
        </div>
    </div>
    
    <div id="ui-container" class="glass">
        <button class="btn btn-emoji" data-val="😂">😂</button>
        <button class="btn btn-emoji" data-val="❤️">❤️</button>
        <button class="btn btn-emoji" data-val="🔥">🔥</button>
        <input type="text" id="text-input" placeholder="Nhập chữ + Enter...">
        <button class="btn btn-action" onclick="document.getElementById('image-upload').click()">📷 Tải Ảnh Lên</button>
        <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp">
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const glowBg = document.getElementById('bg-glow');

        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        let menuOpen = false;

        function toggleMenu() {
            menuOpen = !menuOpen;
            sidebar.classList.toggle('open');
            if (menuOpen) {
                overlay.style.display = 'block'; setTimeout(() => overlay.style.opacity = '1', 10);
            } else {
                overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 300);
            }
        }
        menuBtn.addEventListener('click', toggleMenu); overlay.addEventListener('click', toggleMenu);

        // --- HỆ THỐNG BIẾN TOÀN CỤC ---
        const BASE_PARTICLES = 2500; 
        let MAX_PARTICLES = parseInt(document.getElementById('particle-slider').value); 
        let particles = [];
        let isMouseDown = false;
        let mouseMode = document.getElementById('mouse-mode').value; 
        let blackHoleForce = 0;
        const mouse = { x: -1000, y: -1000, radius: 100 };
        let currentRenderState = null;

        // --- CÁC BIẾN CHO BENCHMARK ---
        let isBenchmarking = false;
        let lastTime = 0;
        let frameCount = 0;
        let currentFPS = 60;
        let fpsDropsCount = 0; // Đếm số lần FPS tụt liên tiếp để kết luận lag

        const Sound = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playSwoosh() {
                if (!this.ctx || isBenchmarking) return; // Tắt tiếng khi đang test
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            },
            playPop() {
                if (!this.ctx || isBenchmarking) return;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
        };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; if(!isBenchmarking) renderCurrentState(); }
        window.addEventListener('resize', resizeCanvas); 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('mousedown', () => { isMouseDown = true; Sound.init(); });
        window.addEventListener('mouseup', () => { isMouseDown = false; if (mouseMode === 'blackhole' && !isBenchmarking) releaseBlackHole(); });
        window.addEventListener('touchstart', () => { isMouseDown = true; Sound.init(); });
        window.addEventListener('touchend', () => { isMouseDown = false; if (mouseMode === 'blackhole' && !isBenchmarking) releaseBlackHole(); });
        
        document.getElementById('mouse-mode').addEventListener('change', e => mouseMode = e.target.value);
        document.getElementById('particle-slider').addEventListener('input', e => {
            document.getElementById('particle-count-display').innerText = new Intl.NumberFormat().format(e.target.value);
        });
        document.getElementById('particle-slider').addEventListener('change', e => {
            MAX_PARTICLES = parseInt(e.target.value);
            renderCurrentState();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.originX = this.x; this.originY = this.y;
                this.wanderAngle = Math.random() * Math.PI * 2; this.wanderSpeed = Math.random() * 0.02;
                this.wanderRadius = Math.random() * 1 + 0.5; 
                this.targetSize = this.wanderRadius; this.currentSize = this.wanderRadius;
                this.color = 'rgba(255, 255, 255, 0.2)'; this.targetColor = this.color;
                this.vx = 0; this.vy = 0; this.ease = 0.04 + Math.random() * 0.06;
                this.isWandering = true;
            }
            setTarget(x, y, color, stepSize) {
                this.originX = x; this.originY = y; this.targetColor = color;
                let dynamicRadius = (stepSize * 0.6) + (Math.random() * 0.4); 
                this.targetSize = Math.max(dynamicRadius, 1.5); 
                this.isWandering = false;
            }
            setWander() {
                this.isWandering = true; this.targetColor = 'rgba(255, 255, 255, 0.2)'; this.targetSize = this.wanderRadius;
            }
            applyShockwave(cx, cy) {
                let dx = this.x - cx; let dy = this.y - cy; let dist = Math.hypot(dx, dy) || 1; 
                let force = (canvas.width / 2) / dist;
                this.vx += (dx / dist) * force * (Math.random() * 3); this.vy += (dy / dist) * force * (Math.random() * 3);
            }
            update() {
                this.currentSize += (this.targetSize - this.currentSize) * 0.15;
                this.color = this.targetColor;
                this.x += this.vx; this.y += this.vy; this.vx *= 0.82; this.vy *= 0.82; 

                if (this.isWandering) {
                    this.wanderAngle += this.wanderSpeed;
                    this.x += Math.cos(this.wanderAngle) * 0.5; this.y += Math.sin(this.wanderAngle) * 0.5;
                    if(this.x < 0) this.x = canvas.width; if(this.x > canvas.width) this.x = 0;
                    if(this.y < 0) this.y = canvas.height; if(this.y > canvas.height) this.y = 0;
                } else if (!isBenchmarking) { 
                    // Tắt tương tác chuột khi đang stress test để đo hiệu năng thuần túy
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.hypot(dx, dy);

                    if (mouseMode === 'blackhole' && isMouseDown) {
                        blackHoleForce += 0.0005; 
                        if (distance < mouse.radius * 3) {
                            let angle = Math.atan2(dy, dx);
                            this.x += Math.cos(angle) * 5 + Math.cos(angle + Math.PI/2) * 10;
                            this.y += Math.sin(angle) * 5 + Math.sin(angle + Math.PI/2) * 10;
                        }
                    } else if (mouseMode === 'orbit' && distance < mouse.radius * 1.5 && distance > 0) {
                        let angle = Math.atan2(dy, dx);
                        this.x += Math.cos(angle + Math.PI/2) * 8; this.y += Math.sin(angle + Math.PI/2) * 8;
                        this.x += (dx / distance) * 2; this.y += (dy / distance) * 2;
                    } else if (mouseMode === 'vortex' && distance < mouse.radius * 1.2 && distance > 0) {
                        let angle = Math.atan2(dy, dx); let force = (mouse.radius * 1.2 - distance) / (mouse.radius * 1.2);
                        this.x -= Math.cos(angle) * force * 5; this.y -= Math.sin(angle) * force * 5;
                        this.x += Math.cos(angle + Math.PI/2) * force * 15; this.y += Math.sin(angle + Math.PI/2) * force * 15;
                    } else if (distance < mouse.radius && distance > 0) {
                        let f = (mouse.radius - distance) / mouse.radius;
                        if (mouseMode === 'repulse') { this.x -= (dx / distance) * f * 10; this.y -= (dy / distance) * f * 10; } 
                        else if (mouseMode === 'attract') { this.x += (dx / distance) * f * 5; this.y += (dy / distance) * f * 5; }
                    } else {
                        this.x += (this.originX - this.x) * this.ease; this.y += (this.originY - this.y) * this.ease;
                    }
                }
            }
            draw() {
                ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < BASE_PARTICLES; i++) particles.push(new Particle());

        function releaseBlackHole() {
            if (blackHoleForce > 0) { Sound.playPop(); particles.forEach(p => p.applyShockwave(mouse.x, mouse.y)); blackHoleForce = 0; }
        }

        function extractPixels(sourceCanvas, ctxHidden) {
            if(isBenchmarking) return;
            const imageData = ctxHidden.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const pixels = imageData.data; let points = []; let totalPixels = 0;
            
            for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 50) totalPixels++;
            let targetParticles = Math.min(totalPixels, MAX_PARTICLES);
            const step = Math.max(Math.round(Math.sqrt(totalPixels / targetParticles)), 1);
            let rSum=0, gSum=0, bSum=0, count=0;

            for (let y = 0; y < sourceCanvas.height; y += step) {
                for (let x = 0; x < sourceCanvas.width; x += step) {
                    const index = (y * sourceCanvas.width + x) * 4;
                    if (pixels[index + 3] > 50) { 
                        const r = pixels[index], g = pixels[index+1], b = pixels[index+2];
                        rSum += r; gSum += g; bSum += b; count++;
                        points.push({ x, y, color: `rgba(${r},${g},${b},1)` });
                    }
                }
            }
            
            if (count > 0) {
                let avgColor = `rgba(${~~(rSum/count)}, ${~~(gSum/count)}, ${~~(bSum/count)}, 0.15)`;
                glowBg.style.background = `radial-gradient(circle, ${avgColor} 0%, rgba(5,9,20,0) 60%)`;
            }

            points.sort(() => Math.random() - 0.5);
            if (points.length > MAX_PARTICLES) points = points.slice(0, MAX_PARTICLES);

            while (particles.length < points.length) particles.push(new Particle());
            let requiredParticles = Math.max(points.length, BASE_PARTICLES);
            if (particles.length > requiredParticles) particles.splice(requiredParticles, particles.length - requiredParticles);

            particles.forEach(p => p.applyShockwave(canvas.width/2, canvas.height/2));
            Sound.playSwoosh();

            for (let i = 0; i < particles.length; i++) {
                if (i < points.length) particles[i].setTarget(points[i].x, points[i].y, points[i].color, step);
                else particles[i].setWander();
            }
        }

        function renderCurrentState() {
            if (!currentRenderState || isBenchmarking) return;
            const hCanvas = document.createElement('canvas'); hCanvas.width = canvas.width; hCanvas.height = canvas.height;
            const hCtx = hCanvas.getContext('2d');

            if (currentRenderState.type === 'emoji') {
                hCtx.font = `${Math.min(canvas.width, canvas.height)*0.4}px sans-serif`; hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle';
                hCtx.fillText(currentRenderState.data, canvas.width/2, canvas.height/2);
            } else if (currentRenderState.type === 'text') {
                let fontSize = Math.min(canvas.width, canvas.height) * 0.25; hCtx.font = `900 ${fontSize}px 'Segoe UI'`;
                let textWidth = hCtx.measureText(currentRenderState.data).width; let maxWidth = canvas.width * 0.9; 
                if (textWidth > maxWidth) { fontSize = fontSize * (maxWidth / textWidth); hCtx.font = `900 ${fontSize}px 'Segoe UI'`; }
                hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle'; hCtx.fillStyle = '#4ade80';
                hCtx.fillText(currentRenderState.data, canvas.width/2, canvas.height/2);
            } else if (currentRenderState.type === 'image') {
                let img = currentRenderState.data; let scale = Math.min((canvas.width*0.8)/img.width, (canvas.height*0.8)/img.height);
                let w = img.width * scale; let h = img.height * scale; let dx = (canvas.width - w)/2; let dy = (canvas.height - h)/2;
                hCtx.drawImage(img, dx, dy, w, h);
            }
            extractPixels(hCanvas, hCtx);
        }

        // --- MODULE BENCHMARK CHUYÊN SÂU ---
        document.getElementById('btn-benchmark').addEventListener('click', () => {
            if(isBenchmarking) return;
            isBenchmarking = true;
            fpsDropsCount = 0;
            
            document.getElementById('btn-benchmark').disabled = true;
            const statusText = document.getElementById('benchmark-status');
            statusText.style.display = 'block';
            statusText.style.color = '#fbbf24';
            statusText.innerText = 'Đang khởi động Stress Test...';

            // Xóa hết trạng thái hiện tại, đưa về dạng bay tự do
            particles = [];
            for (let i = 0; i < 2000; i++) particles.push(new Particle());
            glowBg.style.background = 'none';
        });

        // --- VÒNG LẶP ANIMATION CÓ ĐO FPS ---
        function animate(timestamp) {
            // Tính toán FPS mỗi nửa giây (500ms)
            if (!lastTime) lastTime = timestamp;
            let delta = timestamp - lastTime;
            frameCount++;
            
            if (delta >= 500) {
                currentFPS = Math.round((frameCount * 1000) / delta);
                frameCount = 0;
                lastTime = timestamp;
                
                // Thuật toán Benchmark
                if (isBenchmarking) {
                    const statusText = document.getElementById('benchmark-status');
                    
                    if (currentFPS >= 24 && particles.length < 100000) {
                        // FPS ổn định -> Bơm thêm hạt
                        let addAmount = particles.length < 20000 ? 2000 : 5000; // Càng lên cao bơm càng nhanh
                        for (let i = 0; i < addAmount; i++) {
                            if (particles.length >= 100000) break;
                            particles.push(new Particle());
                        }
                        statusText.innerHTML = `⏳ Đang Test: <span style="color:#fff">${new Intl.NumberFormat().format(particles.length)}</span> hạt<br>Độ mượt: ${currentFPS} FPS`;
                        fpsDropsCount = 0; // Reset bộ đếm lag
                    } else {
                        // FPS dưới 24 (lag) HOẶC đạt đỉnh 100k
                        fpsDropsCount++;
                        if (fpsDropsCount >= 2 || particles.length >= 100000) {
                            // Kết thúc Test
                            isBenchmarking = false;
                            document.getElementById('btn-benchmark').disabled = false;
                            
                            // Giảm lại một nấc để đảm bảo an toàn thực tế
                            let safeLimit = particles.length >= 100000 ? 100000 : Math.max(2000, particles.length - 2000);
                            
                            statusText.style.color = '#4ade80';
                            statusText.innerHTML = `✅ Hoàn tất!<br>Thiết bị chịu được tối đa: <b>${new Intl.NumberFormat().format(safeLimit)}</b> hạt.`;
                            
                            // Áp dụng cấu hình an toàn cho UI
                            MAX_PARTICLES = safeLimit;
                            document.getElementById('particle-slider').value = safeLimit;
                            document.getElementById('particle-count-display').innerText = new Intl.NumberFormat().format(safeLimit);
                            
                            // Tự động khôi phục ảnh/chữ đang hiển thị (nếu có) sau 3 giây
                            setTimeout(() => {
                                statusText.style.display = 'none';
                                renderCurrentState();
                            }, 3500);
                        }
                    }
                }
            }

            ctx.fillStyle = 'rgba(5, 9, 20, 0.4)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bỏ qua nối dây khi Benchmark để kiểm tra thuần túy sức mạnh xử lý số lượng
            if (!isBenchmarking) {
                ctx.lineWidth = 0.5;
                let wanderers = particles.filter(p => p.isWandering);
                let maxLineChecks = Math.min(wanderers.length, 100);
                for (let i = 0; i < maxLineChecks; i++) {
                    for (let j = i + 1; j < maxLineChecks; j++) {
                        let dx = wanderers[i].x - wanderers[j].x; let dy = wanderers[i].y - wanderers[j].y;
                        let dist = dx*dx + dy*dy;
                        if (dist < 4000) { 
                            ctx.strokeStyle = `rgba(255,255,255,${0.15 - dist/40000})`; 
                            ctx.beginPath(); ctx.moveTo(wanderers[i].x, wanderers[i].y); ctx.lineTo(wanderers[j].x, wanderers[j].y); ctx.stroke();
                        }
                    }
                }
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }
        
        requestAnimationFrame(animate);

        // --- XỬ LÝ SỰ KIỆN INPUT HIỂN THỊ ---
        document.querySelectorAll('.btn-emoji').forEach(btn => {
            btn.addEventListener('click', e => {
                Sound.init(); currentRenderState = { type: 'emoji', data: e.target.getAttribute('data-val') }; renderCurrentState();
            });
        });
        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                Sound.init(); const text = this.value.trim(); if(!text) return;
                currentRenderState = { type: 'text', data: text }; renderCurrentState(); this.value = ''; this.blur();
            }
        });
        document.getElementById('image-upload').addEventListener('change', function(e) {
            Sound.init(); const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image(); img.onload = function() { currentRenderState = { type: 'image', data: img }; renderCurrentState(); };
                img.src = event.target.result;
            }; reader.readAsDataURL(file);
        });

    </script>
</body>
</html>
