<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Particle Fusion V6 - Dual Engine (CPU/GPU)</title>
    <!-- Tải thư viện Three.js để xử lý GPU -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #050914; overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; touch-action: none; color: white;
        }
        
        /* 2 Canvas xếp đè lên nhau */
        #particle-canvas, #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #webgl-canvas { display: none; } /* Mặc định ẩn GPU */

        #bg-glow {
            position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(5,9,20,0) 60%);
            z-index: 0; transition: background 1s ease; pointer-events: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Menu 3 gạch */
        #menu-btn {
            position: absolute; top: 20px; left: 20px; z-index: 40; width: 50px; height: 50px; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
            cursor: pointer; transition: 0.3s;
        }
        #menu-btn:hover { background: rgba(255, 255, 255, 0.15); }
        #menu-btn span { width: 26px; height: 3px; background: white; border-radius: 3px; transition: 0.3s ease; }

        /* Sidebar Cài đặt */
        #sidebar {
            position: absolute; top: 0; left: -320px; width: 320px; height: 100vh;
            z-index: 30; background: rgba(5, 9, 20, 0.9); padding: 80px 20px 20px 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #sidebar.open { left: 0; }
        
        .sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 25px; color: #4ade80; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .control-group { margin-bottom: 20px; }
        .control-group label { font-size: 13px; color: #ccc; margin-bottom: 8px; display: flex; justify-content: space-between;}
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4ade80; }
        select {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #555; 
            color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 14px;
        }

        /* Engine Switcher (Nút gạt mới) */
        .engine-switch { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid #4ade80; margin-bottom: 20px; }
        .engine-switch select { border: none; background: transparent; color: #4ade80; font-weight: bold; font-size: 16px; padding: 0;}
        .engine-desc { font-size: 11px; color: #aaa; margin-top: 5px; line-height: 1.4; }

        #btn-benchmark {
            width: 100%; background: linear-gradient(45deg, #f43f5e, #fb923c);
            border: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #btn-benchmark:hover { opacity: 0.8; transform: scale(1.02); }
        #btn-benchmark:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #benchmark-status { font-size: 13px; font-weight: bold; color: #fbbf24; margin-top: 10px; text-align: center; display: none; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;}

        /* UI Main Bottom */
        #ui-container {
            position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 10; padding: 12px; border-radius: 30px;
            flex-wrap: wrap; justify-content: center; width: max-content; max-width: 95vw; align-items: center;
        }

        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .btn-emoji { font-size: 20px; width: 45px; height: 45px; border-radius: 50%; }
        .btn-action { font-size: 14px; padding: 0 15px; height: 45px; border-radius: 22.5px; font-weight: bold; }
        .btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-3px); }

        #text-input { height: 45px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0 15px; border-radius: 22.5px; outline: none; font-size: 14px; min-width: 140px; transition: 0.3s; }
        #text-input:focus { border-color: #4ade80; width: 180px; }

        #image-upload { display: none; }
        #instruction { position: absolute; top: 35px; left: 80px; z-index: 10; pointer-events: none; opacity: 0.5; font-size: 14px; }
        #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 25; display: none; opacity: 0; transition: 0.3s; }

        @media (max-width: 600px) {
            #instruction { display: none; }
            #ui-container { bottom: 2vh; gap: 8px; padding: 10px; border-radius: 20px; }
            .btn-emoji { width: 40px; height: 40px; font-size: 18px; }
            #text-input { width: 120px; height: 40px; }
            .btn-action { height: 40px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="bg-glow"></div>
    
    <!-- 2 Engine Canvas -->
    <canvas id="particle-canvas"></canvas> 
    <canvas id="webgl-canvas"></canvas>

    <div id="overlay"></div>
    <div id="instruction">← Menu: Đổi lõi CPU/GPU & Cài đặt</div>

    <div id="menu-btn" class="glass"><span></span><span></span><span></span></div>

    <div id="sidebar" class="glass">
        <div class="sidebar-title">⚙️ Trung tâm điều khiển</div>

        <!-- BỘ CHUYỂN ĐỔI ENGINE -->
        <div class="control-group engine-switch">
            <select id="engine-mode">
                <option value="cpu">⚡ Lõi CPU (Canvas 2D)</option>
                <option value="gpu">🚀 Lõi GPU (WebGL 3D)</option>
            </select>
            <div class="engine-desc" id="engine-desc">
                Đang dùng CPU: Có hiệu ứng mờ ảo đẹp mắt, tiết kiệm pin, hợp với < 10.000 hạt.
            </div>
        </div>
        
        <div class="control-group">
            <label>
                <span>Độ nét (Số hạt max):</span>
                <span id="particle-count-display">8500</span>
            </label>
            <input type="range" id="particle-slider" min="2000" max="100000" step="1000" value="8500">
        </div>

        <div class="control-group">
            <label>Tương tác chuột:</label>
            <select id="mouse-mode">
                <option value="repulse">💥 Đẩy (Repulse)</option>
                <option value="attract">🧲 Hút (Attract)</option>
                <option value="blackhole">🌌 Lỗ đen (Nhấn giữ xoáy)</option>
                <option value="orbit" selected>🪐 Quỹ đạo (Orbit)</option>
                <option value="vortex">🌪️ Lốc xoáy (Vortex)</option>
            </select>
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
        
        <div class="control-group">
            <button id="btn-benchmark">🧪 Stress Test (Tìm giới hạn máy)</button>
            <div id="benchmark-status"></div>
        </div>
    </div>
    
    <div id="ui-container" class="glass">
        <button class="btn btn-emoji" data-val="😂">😂</button>
        <button class="btn btn-emoji" data-val="❤️">❤️</button>
        <button class="btn btn-emoji" data-val="🔥">🔥</button>
        <input type="text" id="text-input" placeholder="Nhập chữ + Enter...">
        <button class="btn btn-action" onclick="document.getElementById('image-upload').click()">📷 Tải Ảnh Lên</button>
        <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp">
    </div>

    <script>
        // --- KHỞI TẠO BIẾN CHO CẢ 2 ENGINE ---
        const canvas2d = document.getElementById('particle-canvas');
        const ctx = canvas2d.getContext('2d', { willReadFrequently: true });
        const canvasGL = document.getElementById('webgl-canvas');
        const glowBg = document.getElementById('bg-glow');

        let currentEngine = 'cpu'; // Mặc định CPU
        const BASE_PARTICLES = 2500; 
        const ABSOLUTE_MAX_PARTICLES = 100000;
        let MAX_PARTICLES = parseInt(document.getElementById('particle-slider').value); 
        let particles = [];
        let currentRenderState = null;

        // --- BIẾN THREE.JS (GPU) ---
        let scene, camera, renderer, gpuGeometry, gpuMaterial, gpuPoints;

        // --- TƯƠNG TÁC CHUỘT ---
        let isMouseDown = false;
        let mouseMode = document.getElementById('mouse-mode').value; 
        let blackHoleForce = 0;
        const mouse = { x: -1000, y: -1000, radius: 100 };

        // --- KHỞI TẠO GPU (THREE.JS) ---
        function initGPU() {
            scene = new THREE.Scene();
            // Khớp tọa độ 3D y hệt với tọa độ 2D Canvas
            camera = new THREE.OrthographicCamera(0, window.innerWidth, 0, window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ canvas: canvasGL, alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            gpuGeometry = new THREE.BufferGeometry();
            let positions = new Float32Array(ABSOLUTE_MAX_PARTICLES * 3);
            let colors = new Float32Array(ABSOLUTE_MAX_PARTICLES * 3);
            let sizes = new Float32Array(ABSOLUTE_MAX_PARTICLES);

            gpuGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            gpuGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            gpuGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // Shader siêu nhẹ để vẽ hình tròn với kích thước tùy biến cho GPU
            gpuMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    attribute float size; attribute vec3 color; varying vec3 vColor;
                    void main() {
                        vColor = color; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size; gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        vec2 xy = gl_PointCoord.xy - vec2(0.5);
                        if(length(xy) > 0.5) discard; // Cắt thành hình tròn
                        gl_FragColor = vec4(vColor, 0.8);
                    }
                `,
                transparent: true, depthWrite: false
            });

            gpuPoints = new THREE.Points(gpuGeometry, gpuMaterial);
            scene.add(gpuPoints);
        }
        initGPU();

        // --- MENU LOGIC ---
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        function toggleMenu() {
            sidebar.classList.toggle('open');
            if (sidebar.classList.contains('open')) { overlay.style.display = 'block'; setTimeout(() => overlay.style.opacity = '1', 10); } 
            else { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 300); }
        }
        menuBtn.addEventListener('click', toggleMenu); overlay.addEventListener('click', toggleMenu);

        // --- ĐỔI ENGINE (CHÌA KHÓA V6) ---
        document.getElementById('engine-mode').addEventListener('change', e => {
            currentEngine = e.target.value;
            const desc = document.getElementById('engine-desc');
            if (currentEngine === 'cpu') {
                canvas2d.style.display = 'block';
                canvasGL.style.display = 'none';
                desc.innerHTML = "Đang dùng CPU: Có hiệu ứng mờ ảo đẹp mắt, tiết kiệm pin, hợp với < 10.000 hạt.";
            } else {
                canvas2d.style.display = 'none';
                canvasGL.style.display = 'block';
                desc.innerHTML = "Đang dùng GPU (WebGL): Sức mạnh siêu tốc, cực nét, gánh 100.000 hạt không lag (Có thể ấm máy).";
            }
        });

        // --- SỰ KIỆN RESIZE & INPUT ---
        function resizeCanvas() { 
            canvas2d.width = window.innerWidth; canvas2d.height = window.innerHeight;
            camera.right = window.innerWidth; camera.bottom = window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            renderCurrentState(); 
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('mousedown', () => { isMouseDown = true; });
        window.addEventListener('mouseup', () => { isMouseDown = false; if (mouseMode === 'blackhole') releaseBlackHole(); });
        window.addEventListener('touchstart', () => { isMouseDown = true; });
        window.addEventListener('touchend', () => { isMouseDown = false; if (mouseMode === 'blackhole') releaseBlackHole(); });
        
        document.getElementById('mouse-mode').addEventListener('change', e => mouseMode = e.target.value);
        document.getElementById('particle-slider').addEventListener('input', e => {
            document.getElementById('particle-count-display').innerText = new Intl.NumberFormat().format(e.target.value);
        });
        document.getElementById('particle-slider').addEventListener('change', e => {
            MAX_PARTICLES = parseInt(e.target.value); renderCurrentState();
        });

        // --- CẤU TRÚC HẠT (CHUNG CHO CẢ CPU & GPU) ---
        class Particle {
            constructor() {
                this.x = Math.random() * canvas2d.width; this.y = Math.random() * canvas2d.height;
                this.originX = this.x; this.originY = this.y;
                
                this.wanderAngle = Math.random() * Math.PI * 2; this.wanderSpeed = Math.random() * 0.02;
                this.wanderRadius = Math.random() * 1 + 0.5; 
                this.targetSize = this.wanderRadius; this.currentSize = this.wanderRadius;
                
                // Lưu r, g, b riêng biệt để cấp cho mảng GPU
                this.r = 255; this.g = 255; this.b = 255;
                this.targetR = 255; this.targetG = 255; this.targetB = 255;
                
                this.vx = 0; this.vy = 0; this.ease = 0.04 + Math.random() * 0.06;
                this.isWandering = true;
            }
            setTarget(x, y, r, g, b, stepSize) {
                this.originX = x; this.originY = y; 
                this.targetR = r; this.targetG = g; this.targetB = b;
                let dynamicRadius = (stepSize * 0.6) + (Math.random() * 0.4); 
                this.targetSize = Math.max(dynamicRadius, 1.5); 
                this.isWandering = false;
            }
            setWander() {
                this.isWandering = true; 
                this.targetR = 255; this.targetG = 255; this.targetB = 255;
                this.targetSize = this.wanderRadius;
            }
            applyShockwave(cx, cy) {
                let dx = this.x - cx; let dy = this.y - cy; let dist = Math.hypot(dx, dy) || 1; 
                let force = (canvas2d.width / 2) / dist;
                this.vx += (dx / dist) * force * (Math.random() * 3); this.vy += (dy / dist) * force * (Math.random() * 3);
            }
            updatePhysics() {
                // Nội suy (LERP) size và màu mượt mà
                this.currentSize += (this.targetSize - this.currentSize) * 0.15;
                this.r += (this.targetR - this.r) * 0.1;
                this.g += (this.targetG - this.g) * 0.1;
                this.b += (this.targetB - this.b) * 0.1;

                this.x += this.vx; this.y += this.vy; this.vx *= 0.82; this.vy *= 0.82; 

                if (this.isWandering) {
                    this.wanderAngle += this.wanderSpeed;
                    this.x += Math.cos(this.wanderAngle) * 0.5; this.y += Math.sin(this.wanderAngle) * 0.5;
                    if(this.x < 0) this.x = canvas2d.width; if(this.x > canvas2d.width) this.x = 0;
                    if(this.y < 0) this.y = canvas2d.height; if(this.y > canvas2d.height) this.y = 0;
                } else {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.hypot(dx, dy);

                    if (mouseMode === 'blackhole' && isMouseDown) {
                        blackHoleForce += 0.0005; 
                        if (distance < mouse.radius * 3) {
                            let angle = Math.atan2(dy, dx);
                            this.x += Math.cos(angle) * 5 + Math.cos(angle + Math.PI/2) * 10;
                            this.y += Math.sin(angle) * 5 + Math.sin(angle + Math.PI/2) * 10;
                        }
                    } else if (mouseMode === 'orbit' && distance < mouse.radius * 1.5 && distance > 0) {
                        let angle = Math.atan2(dy, dx);
                        this.x += Math.cos(angle + Math.PI/2) * 8; this.y += Math.sin(angle + Math.PI/2) * 8;
                        this.x += (dx / distance) * 2; this.y += (dy / distance) * 2;
                    } else if (mouseMode === 'vortex' && distance < mouse.radius * 1.2 && distance > 0) {
                        let angle = Math.atan2(dy, dx); let force = (mouse.radius * 1.2 - distance) / (mouse.radius * 1.2);
                        this.x -= Math.cos(angle) * force * 5; this.y -= Math.sin(angle) * force * 5;
                        this.x += Math.cos(angle + Math.PI/2) * force * 15; this.y += Math.sin(angle + Math.PI/2) * force * 15;
                    } else if (distance < mouse.radius && distance > 0) {
                        let f = (mouse.radius - distance) / mouse.radius;
                        if (mouseMode === 'repulse') { this.x -= (dx / distance) * f * 10; this.y -= (dy / distance) * f * 10; } 
                        else if (mouseMode === 'attract') { this.x += (dx / distance) * f * 5; this.y += (dy / distance) * f * 5; }
                    } else {
                        this.x += (this.originX - this.x) * this.ease; this.y += (this.originY - this.y) * this.ease;
                    }
                }
            }
            draw2D() {
                ctx.fillStyle = `rgba(${~~this.r}, ${~~this.g}, ${~~this.b}, 0.8)`; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < BASE_PARTICLES; i++) particles.push(new Particle());

        function releaseBlackHole() { if (blackHoleForce > 0) { particles.forEach(p => p.applyShockwave(mouse.x, mouse.y)); blackHoleForce = 0; } }

        // --- XỬ LÝ ẢNH CHUNG ---
        function extractPixels(sourceCanvas, ctxHidden) {
            const imageData = ctxHidden.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const pixels = imageData.data; let points = []; let totalPixels = 0;
            
            for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 50) totalPixels++;
            let targetParticles = Math.min(totalPixels, MAX_PARTICLES);
            const step = Math.max(Math.round(Math.sqrt(totalPixels / targetParticles)), 1);
            let rSum=0, gSum=0, bSum=0, count=0;

            for (let y = 0; y < sourceCanvas.height; y += step) {
                for (let x = 0; x < sourceCanvas.width; x += step) {
                    const index = (y * sourceCanvas.width + x) * 4;
                    if (pixels[index + 3] > 50) { 
                        const r = pixels[index], g = pixels[index+1], b = pixels[index+2];
                        rSum += r; gSum += g; bSum += b; count++;
                        points.push({ x, y, r, g, b });
                    }
                }
            }
            
            if (count > 0) {
                let avgColor = `rgba(${~~(rSum/count)}, ${~~(gSum/count)}, ${~~(bSum/count)}, 0.15)`;
                glowBg.style.background = `radial-gradient(circle, ${avgColor} 0%, rgba(5,9,20,0) 60%)`;
            }

            points.sort(() => Math.random() - 0.5);
            if (points.length > MAX_PARTICLES) points = points.slice(0, MAX_PARTICLES);

            while (particles.length < points.length) particles.push(new Particle());
            let requiredParticles = Math.max(points.length, BASE_PARTICLES);
            if (particles.length > requiredParticles) particles.splice(requiredParticles, particles.length - requiredParticles);

            particles.forEach(p => p.applyShockwave(canvas2d.width/2, canvas2d.height/2));

            for (let i = 0; i < particles.length; i++) {
                if (i < points.length) particles[i].setTarget(points[i].x, points[i].y, points[i].r, points[i].g, points[i].b, step);
                else particles[i].setWander();
            }
        }

        function renderCurrentState() {
            if (!currentRenderState) return;
            const hCanvas = document.createElement('canvas'); hCanvas.width = canvas2d.width; hCanvas.height = canvas2d.height;
            const hCtx = hCanvas.getContext('2d');
            if (currentRenderState.type === 'emoji') {
                hCtx.font = `${Math.min(canvas2d.width, canvas2d.height)*0.4}px sans-serif`; hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle';
                hCtx.fillText(currentRenderState.data, canvas2d.width/2, canvas2d.height/2);
            } else if (currentRenderState.type === 'image') {
                let img = currentRenderState.data; let scale = Math.min((canvas2d.width*0.8)/img.width, (canvas2d.height*0.8)/img.height);
                let w = img.width * scale; let h = img.height * scale; let dx = (canvas2d.width - w)/2; let dy = (canvas2d.height - h)/2;
                hCtx.drawImage(img, dx, dy, w, h);
            } else if (currentRenderState.type === 'text') {
                let fontSize = Math.min(canvas2d.width, canvas2d.height) * 0.25; hCtx.font = `900 ${fontSize}px 'Segoe UI'`;
                let textWidth = hCtx.measureText(currentRenderState.data).width; let maxWidth = canvas2d.width * 0.9; 
                if (textWidth > maxWidth) { fontSize = fontSize * (maxWidth / textWidth); hCtx.font = `900 ${fontSize}px 'Segoe UI'`; }
                hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle'; hCtx.fillStyle = '#4ade80';
                hCtx.fillText(currentRenderState.data, canvas2d.width/2, canvas2d.height/2);
            }
            extractPixels(hCanvas, hCtx);
        }

        // --- VÒNG LẶP CHUNG (DUAL CORE) ---
        function animate() {
            let positions = gpuGeometry.attributes.position.array;
            let colors = gpuGeometry.attributes.color.array;
            let sizes = gpuGeometry.attributes.size.array;
            
            // Nếu là CPU thì tô màu nền (tạo đuôi mờ)
            if (currentEngine === 'cpu') {
                ctx.fillStyle = 'rgba(5, 9, 20, 0.4)'; 
                ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);
            } else {
                // GPU thì clear 100% để tối đa tốc độ
                renderer.clear();
            }

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.updatePhysics(); // Não bộ tính toán vẫn chạy chung

                if (currentEngine === 'cpu') {
                    p.draw2D();
                } else {
                    // Xuất dữ liệu thẳng sang VRAM của máy
                    positions[i * 3] = p.x;
                    positions[i * 3 + 1] = canvas2d.height - p.y; // Đảo ngược Y cho chuẩn 3D
                    sizes[i] = p.currentSize * 2.5 * window.devicePixelRatio; 
                    colors[i * 3] = p.r / 255;
                    colors[i * 3 + 1] = p.g / 255;
                    colors[i * 3 + 2] = p.b / 255;
                }
            }

            // Gọi lệnh render GPU
            if (currentEngine === 'gpu') {
                gpuGeometry.setDrawRange(0, particles.length);
                gpuGeometry.attributes.position.needsUpdate = true;
                gpuGeometry.attributes.color.needsUpdate = true;
                gpuGeometry.attributes.size.needsUpdate = true;
                renderer.render(scene, camera);
            }
            
            requestAnimationFrame(animate);
        }
        
        requestAnimationFrame(animate);

        // --- SỰ KIỆN CLICK ---
        document.querySelectorAll('.btn-emoji').forEach(btn => {
            btn.addEventListener('click', e => { currentRenderState = { type: 'emoji', data: e.target.getAttribute('data-val') }; renderCurrentState(); });
        });
        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { const text = this.value.trim(); if(text){ currentRenderState = { type: 'text', data: text }; renderCurrentState(); this.value = ''; this.blur();} }
        });
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image(); img.onload = function() { currentRenderState = { type: 'image', data: img }; renderCurrentState(); };
                img.src = event.target.result;
            }; reader.readAsDataURL(file);
        });

    </script>
</body>
</html>
